[project]
name = "discount-mate-etl-pipeline"
version = "0.1.0"
description = "Reusable ETL framework using uv, DuckDB, PostgreSQL, and Alembic."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "duckdb>=1.5.3",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pytz>=2026.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.50",
    "duckdb-extensions>=1.5.3",
    "duckdb-extension-httpfs>=1.5.3",
    "duckdb-extension-postgres>=1.5.3",
]

[dependency-groups]
dev = [
    "ruff>=0.15.15",
]
