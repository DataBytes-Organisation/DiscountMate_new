name: Data Pipeline Deploy

on:
  workflow_dispatch:
    inputs:
      pipeline:
        description: Pipeline to deploy to production Cloud Run Jobs
        required: true
        default: both
        type: choice
        options:
          - both
          - ingestion
          - etl

permissions:
  contents: read

jobs:
  ingestion-checks:
    if: inputs.pipeline == 'both' || inputs.pipeline == 'ingestion'
    uses: ./.github/workflows/ingestion-pipeline-checks.yml

  deploy-ingestion:
    name: Deploy ingestion Cloud Run Jobs
    if: vars.ENABLE_DATA_PIPELINE_DEPLOY == 'true'
    needs: ingestion-checks
    runs-on: ubuntu-latest
    concurrency:
      group: ingestion-pipeline-prod
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push image
        working-directory: .
        run: |
          IMAGE_URI="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REGISTRY_REPO }}/${{ vars.INGESTION_IMAGE_NAME }}:${{ github.sha }}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "${GITHUB_ENV}"
          docker build --platform linux/amd64 -t "${IMAGE_URI}" DE/ingestion-pipeline
          docker push "${IMAGE_URI}"

      - name: Update ingestion jobs
        run: |
          for JOB in \
            discount-mate-ingestion-ww \
            discount-mate-ingestion-iga \
            discount-mate-ingestion-aldi \
            discount-mate-ingestion-coles
          do
            gcloud run jobs update "${JOB}" \
              --image "${IMAGE_URI}" \
              --region "${{ vars.GCP_REGION }}" \
              --project "${{ vars.GCP_PROJECT_ID }}" \
              --quiet
          done

  etl-checks:
    if: inputs.pipeline == 'both' || inputs.pipeline == 'etl'
    uses: ./.github/workflows/etl-pipeline-checks.yml

  deploy-etl:
    name: Deploy ETL Cloud Run Jobs
    if: vars.ENABLE_DATA_PIPELINE_DEPLOY == 'true'
    needs: etl-checks
    runs-on: ubuntu-latest
    concurrency:
      group: etl-pipeline-prod
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push image
        working-directory: .
        run: |
          IMAGE_URI="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REGISTRY_REPO }}/${{ vars.ETL_IMAGE_NAME }}:${{ github.sha }}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "${GITHUB_ENV}"
          docker build --platform linux/amd64 -t "${IMAGE_URI}" DE/etl-pipeline
          docker push "${IMAGE_URI}"

      - name: Update ETL jobs
        run: |
          for JOB in \
            discount-mate-etl-ww \
            discount-mate-etl-iga \
            discount-mate-etl-aldi \
            discount-mate-etl-coles
          do
            gcloud run jobs update "${JOB}" \
              --image "${IMAGE_URI}" \
              --region "${{ vars.GCP_REGION }}" \
              --project "${{ vars.GCP_PROJECT_ID }}" \
              --quiet
          done
