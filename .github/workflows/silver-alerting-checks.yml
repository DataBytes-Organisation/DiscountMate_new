name: Silver ETL Alerting Checks

on:
  pull_request:
    branches: [main]
    paths:
      - "DE/etl-pipeline/**"
      - "DE/docs/silver-etl-alerting.md"
      - "discount-mate-infra/**"
      - ".github/workflows/silver-alerting-checks.yml"
  push:
    branches: [main]
    paths:
      - "DE/etl-pipeline/**"
      - "DE/docs/silver-etl-alerting.md"
      - "discount-mate-infra/**"
      - ".github/workflows/silver-alerting-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Silver ETL tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DE/etl-pipeline

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run unit tests
        run: uv run python -m unittest discover -s tests -v

      - name: Run Ruff lint
        run: uv run ruff check .

      - name: Run Ruff format check
        run: uv run ruff format --check .

  terraform:
    name: OpenTofu format and validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.11.0"

      - name: Check Terraform formatting
        run: tofu fmt -check -recursive discount-mate-infra

      - name: Initialize without backend
        working-directory: discount-mate-infra/environments/prod
        run: tofu init -backend=false

      - name: Validate Terraform
        working-directory: discount-mate-infra/environments/prod
        run: tofu validate
